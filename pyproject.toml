[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-project"
version = "0.1.0"
description = "Source-neutral source acquisition foundation for YPI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scraper = "cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
