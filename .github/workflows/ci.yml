name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  docker-synthetic-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - run: docker compose run --rm scraper worker health --runtime-dir /app/runtime
      - run: docker compose run --rm scraper worker run-synthetic --runtime-dir /app/runtime
      - run: docker compose run --rm scraper runtime queue-status --database /app/runtime/database/scraper.sqlite
      - run: docker compose down
